<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>North Pole Santa - Book Your Magical Visit</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Playfair+Display:wght@400;700&display=swap');

        body { font-family: 'Playfair Display', serif; }

        .christmas-font { font-family: 'Mountains of Christmas', cursive; }

        .hero-bg { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://picsum.photos/id/1015/1920/1080'); background-size: cover; background-position: center; }

        .snowflake { position: absolute; color: white; font-size: 1.6rem; animation: snowfall 12s linear infinite; opacity: 0.9; }

        @keyframes snowfall { 0% { transform: translateY(-100px); } 100% { transform: translateY(100vh); } }

    </style>

</head>

<body class="bg-red-950 text-white overflow-x-hidden">

    <!-- Navigation -->

    <nav class="bg-red-900 border-b border-green-600 py-5 sticky top-0 z-50">

        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">

            <div class="flex items-center gap-4">

                <i class="fa-solid fa-hat-wizard text-5xl text-red-300"></i>

                <div class="christmas-font text-4xl font-bold tracking-widest">SANTA'S NORTH POLE</div>

            </div>

            <div class="hidden md:flex gap-8 text-lg">

                <a href="#home" class="hover:text-green-300">Home</a>

                <a href="#gallery" class="hover:text-green-300">Gallery</a>

                <a href="#book" class="hover:text-green-300">Book Now</a>

            </div>

            <button onclick="document.getElementById('book').scrollIntoView({behavior:'smooth'})" class="bg-green-600 hover:bg-green-500 px-8 py-3 rounded-full font-bold">BOOK SANTA</button>

        </div>

    </nav>



    <!-- Hero -->

    <section id="home" class="hero-bg h-screen flex items-center relative">

        <div class="max-w-5xl mx-auto text-center px-6 z-10">

            <h1 class="christmas-font text-8xl font-bold mb-6 text-white">HO HO HO!</h1>

            <p class="text-4xl text-green-100 mb-10">The Real Santa is Coming to Your Home</p>

            <button onclick="document.getElementById('book').scrollIntoView({behavior:'smooth'})" class="bg-white text-red-900 px-16 py-8 text-3xl rounded-3xl font-bold hover:scale-105 transition">Reserve Your Date</button>

        </div>

        <div id="snowflakes" class="absolute inset-0 pointer-events-none"></div>

    </section>



    <!-- Booking Section -->

    <section id="book" class="py-24 bg-gradient-to-b from-green-950 to-red-950">

        <div class="max-w-4xl mx-auto px-6">

            <h2 class="christmas-font text-6xl text-center mb-12">Book Your Santa Visit</h2>

            <form id="booking-form" class="bg-white/10 backdrop-blur p-10 rounded-3xl space-y-8">

                <div class="grid md:grid-cols-2 gap-6">

                    <input type="text" id="name" placeholder="Your Name" required class="bg-transparent border border-green-600 p-6 rounded-3xl text-lg">

                    <input type="email" id="email" placeholder="Email Address" required class="bg-transparent border border-green-600 p-6 rounded-3xl text-lg">

                </div>

                <input type="date" id="date" required class="w-full bg-transparent border border-green-600 p-6 rounded-3xl text-lg">

                <button type="submit" class="w-full bg-red-600 hover:bg-red-500 py-8 text-3xl font-bold rounded-3xl">PROCEED TO PAYMENT</button>

            </form>

        </div>

    </section>



    <footer class="bg-black py-12 text-center">

        <p class="text-green-400">© 2026 North Pole Santa • Made with Christmas Magic</p>

    </footer>



    <script>

        // Snow

        function createSnowflake() {

            const snow = document.createElement('div');

            snow.className = 'snowflake';

            snow.textContent = Math.random() > 0.5 ? '❄' : '❅';

            snow.style.left = Math.random() * 100 + 'vw';

            snow.style.animationDuration = (Math.random() * 8 + 8) + 's';

            document.getElementById('snowflakes').appendChild(snow);

            setTimeout(() => snow.remove(), 25000);

        }

        setInterval(createSnowflake, 150);



        // Booking

        document.getElementById('booking-form').addEventListener('submit', function(e) {

            e.preventDefault();

            const name = document.getElementById('name').value;

            alert(`🎅 Thank you ${name}! Your booking request has been sent to the North Pole. Expect a confirmation email soon!`);

            this.reset();

        });

    </script>

</body>

</html>
